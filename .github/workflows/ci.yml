name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Hard gates: types and the full vitest suite (content tripwires,
      # exercise/action sanitizers, the inspection-game engine, etc.).
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # Committed generated artifacts must match their sources — these checks
      # are offline and catch a hand-edit or a forgotten rebuild. The network
      # importers (gdoc, felonybench, arxiv/substack/lesswrong) are deliberately
      # NOT here: their inputs are other people's live documents, so drift
      # there is news, not a broken build.
      - run: npm run verification:course -- --check
      - run: npm run verification:memos -- --check
      - run: npm run verification:capstones -- --check
      - run: npm run verification:chrome -- --check
      - run: npm run icon:build -- --check
