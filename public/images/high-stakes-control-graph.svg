<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="hs-title">
  <title id="hs-title">The control graph: incrimination per action vs. number of actions to cause catastrophe, with the high-stakes region highlighted</title>

  <!-- Left-margin definitions -->
  <text x="40" y="180" font-size="21" font-weight="700" fill="#233554">&#8220;High-stakes&#8221;:</text>
  <text x="40" y="210" font-size="19" fill="#233554">only a few actions needed</text>
  <text x="40" y="236" font-size="19" fill="#233554">to cause a catastrophe</text>

  <text x="40" y="380" font-size="21" font-weight="700" fill="#9aa1ad">&#8220;Low-stakes&#8221;:</text>
  <text x="40" y="410" font-size="19" fill="#9aa1ad">lots of actions needed</text>
  <text x="40" y="436" font-size="19" fill="#9aa1ad">to cause a catastrophe</text>

  <!-- Plot area: 600 x 540, origin top-left at (340,20) -->
  <g transform="translate(340,20)">
    <!-- Muted: trivially solved (top-right) -->
    <polygon points="170,0 600,0 600,270" fill="#e7e8ea" stroke="#fafafa" stroke-width="3"/>
    <!-- Muted: probably hopeless (bottom-left) -->
    <polygon points="0,300 0,540 300,540" fill="#dcdde1" stroke="#fafafa" stroke-width="3"/>
    <!-- Muted: low-stakes (right band) -->
    <polygon points="430,165 600,270 600,540 300,540" fill="#e7e8ea" stroke="#fafafa" stroke-width="3"/>
    <!-- Highlighted: high-stakes -->
    <polygon points="0,0 170,0 430,165 300,540 0,300" fill="#e69f00" fill-opacity="0.92" stroke="#fafafa" stroke-width="3"/>

    <!-- Region labels -->
    <text x="150" y="120" font-size="26" font-weight="700" fill="#233554">High-stakes</text>
    <text x="430" y="390" font-size="24" font-weight="600" fill="#9aa1ad">Low-stakes</text>
    <text x="510" y="78" font-size="18" fill="#9aa1ad" text-anchor="middle">Trivially solved</text>
    <text x="510" y="101" font-size="18" fill="#9aa1ad" text-anchor="middle">with random auditing</text>
    <text x="100" y="480" font-size="18" fill="#8f96a3" text-anchor="middle">Probably</text>
    <text x="100" y="503" font-size="18" fill="#8f96a3" text-anchor="middle">hopeless?</text>

    <!-- Axes -->
    <line x1="-14" y1="540" x2="-14" y2="-6" stroke="#9ca3af" stroke-width="2.5"/>
    <polygon points="-14,-16 -20,-4 -8,-4" fill="#9ca3af"/>
    <line x1="-14" y1="554" x2="614" y2="554" stroke="#9ca3af" stroke-width="2.5"/>
    <polygon points="624,554 612,548 612,560" fill="#9ca3af"/>
  </g>

  <!-- Axis labels -->
  <text x="316" y="560" transform="rotate(-90 316 560)" font-size="21" font-weight="600" fill="#233554">How incriminating is each action?</text>
  <text x="640" y="614" font-size="21" font-weight="600" fill="#233554" text-anchor="middle">Number of actions to cause catastrophe</text>
</svg>
