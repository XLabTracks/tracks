<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill map — Verification · XLab Tracks</title>
<meta name="description" content="All 27 skills the verification track teaches, which unit advances each one, and how far you have got.">
<!-- Read the stored theme before first paint. A late attribute means the page
     flashes the wrong ground; keep this in step with theme.js — same key,
     same attribute, same values. -->
<script>
(function () {
  try {
    var v = localStorage.getItem('xlab-verification-theme');
    if (v !== 'light' && v !== 'dark' && v !== 'contrast') {
      v = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', v);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="notebook.css">
<link rel="stylesheet" href="platform.css">
<link rel="stylesheet" href="map.css">
</head>
<body>

<div data-topbar></div>

<main class="page page-wide">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="landing.html">Home</a> / Skill map</nav>

  <header class="map-head">
    <div>
      <h1>Skill map</h1>
      <p class="sub">Twenty-seven skills, and the units that advance each one.
        Every node is visible from day one; only the filling is earned.</p>
    </div>
    <div class="map-controls">
      <div class="tabs" role="tablist" aria-label="Map view">
        <button class="tab" role="tab" data-view="mod" aria-selected="true">By module</button>
        <button class="tab" role="tab" data-view="bloom" aria-selected="false">By Bloom level</button>
      </div>
      <div class="progress-row">
        <span class="meter"><i data-bar></i></span>
        <span class="counter" data-count></span>
      </div>
    </div>
  </header>

  <div class="lo-row" data-los aria-label="Learning objectives"></div>

  <div class="map-body">
    <div class="map-canvas" data-canvas>
      <svg data-edges aria-hidden="true"></svg>
      <div data-bands></div>
    </div>
    <aside class="node-card" data-card aria-live="polite"></aside>
  </div>

</main>

<footer data-foot></footer>

<script src="data/course.js"></script>
<script src="data/skills.js"></script>
<script src="theme.js"></script>
<script src="platform.js"></script>
<script src="map.js"></script>
<script src="notebook.js"></script>
<script src="sync.js"></script>
</body>
</html>
