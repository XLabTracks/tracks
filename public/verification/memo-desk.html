<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memo desk · XLab Verification</title>
<meta name="description" content="Every place the Verification Track outline asks for a written output, with the brief where one is drafted and an honest gap note where none is.">
<meta name="robots" content="noindex, follow">
<script>
(function () {
  try {
    var v = localStorage.getItem('xlab-verification-theme');
    if (v !== 'light' && v !== 'dark' && v !== 'contrast') {
      v = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', v);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="fonts.css">

      <h1>Memo desk</h1>
      <p>
        Every place the track outline asks for a written output. Where it
        states the assignment, the brief below is its own words; where it
        marks the slot and leaves it empty, this page says so rather than
        inventing one.
      </p>
    </div>

    <div id="memoDesk"></div>
  </div>
</main>
