<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting…</title>
<meta name="robots" content="noindex">
<!-- The course moved into the app. This page used to be the static module
     player and rendered its own copy of every unit's prose; the reading now
     lives once, at /tracks/verification, and the static site links there.

     Kept as a redirect rather than deleted: ?m=&u= links are in the wild, and
     data/course.js still knows which app page each unit id belongs to.

     Trap: course.js is generated (npm run verification:course). If a unit id
     ever stops resolving here, the mapping in curriculum.ts is what to fix,
     not this file. -->
<script src="data/course.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var unit = q.get('u');
  var to = 'track.html';
  var C = window.COURSE;
  if (C && unit) {
    for (var i = 0; i < C.modules.length; i++) {
      var hit = C.modules[i].units.filter(function (u) { return u.id === unit; })[0];
      if (hit && hit.href) { to = hit.href; break; }
    }
  }
  location.replace(to);
})();
</script>
</head>
<body></body>
</html>
