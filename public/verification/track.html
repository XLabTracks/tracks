<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The track — Verification · XLab Tracks</title>
<meta name="description" content="Five modules, nineteen units: the full verification track with your progress against each.">
<!-- Read the stored theme before first paint. A late attribute means the page
     flashes the wrong ground; keep this in step with theme.js — same key,
     same attribute, same values. -->
<script>
(function () {
  try {
    var v = localStorage.getItem('xlab-verification-theme');
    if (v !== 'light' && v !== 'dark' && v !== 'contrast') {
      v = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', v);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="fonts.css">

  <header class="track-head">

      <h1>Verification</h1>
      <p class="question" data-question></p>
